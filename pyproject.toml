[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumscholar"
version = "0.1.0"
description = "Citation-grounded, quantum-only AI platform with Ralph agentic self-improvement loop"
readme = "README.md"
authors = [{ name = "Antigravity Quantum AI Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "streamlit>=1.32.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0"
]

[project.optional-dependencies]
quantum = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "cirq>=1.3.0",
    "pennylane>=0.35.0"
]
embeddings = [
    "sentence-transformers>=2.5.0",
    "chromadb>=0.4.24"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"
